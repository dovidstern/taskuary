# Taskuary — docker compose up, then http://127.0.0.1:7787
#
# Data persists in the taskuary-data volume. Coding CLIs (Claude Code, Codex, …)
# and the WhatsApp bridge are host programs; they are not in this image.
# Publish past localhost only with TASKUARY_TOKEN set:
#   TASKUARY_TOKEN=... docker compose up
#
# Regression uses its own volume, never the live taskuary-data:
#   docker compose --profile regression run --rm desk
#   docker compose --profile regression up -d taskuary-reg
# Pass --force if the regression volume already has tasks:
#   docker compose --profile regression run --rm desk --force
services:
  taskuary:
    build: .
    image: taskuary:local
    init: true
    ports:
      - "127.0.0.1:7787:7787"
    volumes:
      - taskuary-data:/data
    environment:
      - TASKUARY_HOST=0.0.0.0
      # name-only: pass through from the host when set. `${TOKEN:-}` would inject ''
      # and that used to wipe a token stored on the volume.
      - TASKUARY_TOKEN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  desk:
    profiles: ["regression"]
    image: taskuary:local
    build: .
    user: "1000:1000"
    volumes:
      - taskuary-regression:/data
    environment:
      TASKUARY_HOME: /data
    command: ["python", "-m", "taskuary.testing", "desk"]

  taskuary-reg:
    profiles: ["regression"]
    image: taskuary:local
    build: .
    init: true
    ports:
      - "127.0.0.1:7787:7787"
    volumes:
      - taskuary-regression:/data
    environment:
      - TASKUARY_HOST=0.0.0.0
      - TASKUARY_TOKEN
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The demo: the whole app over invented work, with every door to the outside world shut at
  # the API layer (taskuary/demo.py). This is what /demo on the website runs - a throwaway
  # home in tmpfs, no connectors, a scripted AI and replayed coding sessions, so a restart is
  # a fresh identical demo and nothing a visitor did survives it.
  demo:
    profiles: ["demo"]
    image: taskuary:local
    build: .
    init: true
    ports:
      - "127.0.0.1:7788:7787"
    tmpfs:
      - /data
    environment:
      - TASKUARY_DEMO=1
      - TASKUARY_HOME=/data
      - TASKUARY_HOST=0.0.0.0

volumes:
  taskuary-data:
  taskuary-regression:
